[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slither-cex-detector"
version = "0.1.0"
description = "Custom Slither detector for CEX interface security vulnerabilities"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "rdin777"}
]
keywords = ["slither", "security", "cex", "ethereum", "smart-contracts"]
dependencies = [
    "slither-analyzer>=0.9.0",
]

[project.entry-points."slither.detectors"]
cex_interface = "slither_cex_detector.detector:CEXInterfaceDetector"

[tool.setuptools.packages.find]
include = ["slither_cex_detector*"]
