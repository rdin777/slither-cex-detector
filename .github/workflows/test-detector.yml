name: Test CEX Detector

on:
  push:
    branches: [main, develop]
    paths:
      - 'slither_cex_detector/**/*.py'
      - 'run_detector.py'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - 'slither_cex_detector/**/*.py'
      - 'run_detector.py'
      - 'pyproject.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Test detector on vulnerable contract
        run: |
          python3 run_detector.py test_contracts/VulnerableCEXInterface.sol
          echo "✅ Vulnerable contract analysis completed"
      
      - name: Test detector on secure contract
        run: |
          python3 run_detector.py test_contracts/SecureCEXInterface.sol
          echo "✅ Secure contract analysis completed"
      
      - name: Verify JSON export
        run: |
          python3 run_detector.py test_contracts/VulnerableCEXInterface.sol --json
          if [ -f results.json ]; then
            echo "✅ JSON export successful"
            python3 -c "import json; data=json.load(open('results.json')); print(f'Found {len(data)} vulnerabilities in JSON')"
          else
            echo "❌ JSON export failed"
            exit 1
          fi
