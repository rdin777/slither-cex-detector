name: CEX Interface Security Check

on:
  push:
    branches: [main, develop]
    paths:
      - 'contracts/**/*.sol'
      - 'test_contracts/**/*.sol'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**/*.sol'
      - 'test_contracts/**/*.sol'

jobs:
  security-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install detector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Run CEX security detector on test contracts
        run: |
          python3 run_detector.py test_contracts/VulnerableCEXInterface.sol --json
          python3 run_detector.py test_contracts/SecureCEXInterface.sol --json
      
      - name: Upload security results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-analysis-results
          path: results.json
          retention-days: 30
      
      - name: Check for vulnerabilities
        run: |
          if [ -f results.json ]; then
            VULN_COUNT=$(python3 -c "import json; data=json.load(open('results.json')); print(len(data))")
            echo "Found $VULN_COUNT vulnerabilities"
            if [ "$VULN_COUNT" -gt "0" ]; then
              echo "::warning::Security vulnerabilities detected! Check the artifacts for details."
            fi
          fi
