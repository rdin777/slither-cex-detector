name: CEX Interface Security Check

on:
  push:
    branches: [main, develop]
    paths:
      - 'test_contracts/**/*.sol'
  pull_request:
    branches: [main]
    paths:
      - 'test_contracts/**/*.sol'

jobs:
  security-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install detector
        run: |
          python -m pip install --upgrade pip
          pip install -e . --quiet
      
      - name: Analyze Vulnerable Contract
        run: |
          echo "🔍 Analyzing VulnerableCEXInterface.sol..."
          python3 run_detector.py test_contracts/VulnerableCEXInterface.sol --json
          mv results.json results_vulnerable.json
          echo "✅ Vulnerable analysis complete"
      
      - name: Analyze Secure Contract
        run: |
          echo "🔍 Analyzing SecureCEXInterface.sol..."
          python3 run_detector.py test_contracts/SecureCEXInterface.sol --json
          mv results.json results_secure.json
          echo "✅ Secure analysis complete"
      
      - name: Upload security results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-analysis-results
          path: |
            results_vulnerable.json
            results_secure.json
          retention-days: 30
